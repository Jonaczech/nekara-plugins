name: NekaraFishing
version: ${version}
main: cz.nekara.fishing.NekaraFishingPlugin
api-version: '26.1'
authors:
  - Nekara
description: A non-invasive timing minigame for vanilla fishing on Purpur 26.1.2.
softdepend:
  - ValhallaMMO
commands:
  nekarafishing:
    description: Manage NekaraFishing.
    usage: /nekarafishing <help|reload|status|test|cancel [player]>
    aliases: [nfishing]
permissions:
  nekarafishing.use:
    description: Allows the fishing minigame to start.
    default: true
  nekarafishing.command.help:
    description: Allows help for NekaraFishing.
    default: op
  nekarafishing.command.reload:
    description: Reloads NekaraFishing configuration.
    default: op
  nekarafishing.command.status:
    description: Shows NekaraFishing status.
    default: op
  nekarafishing.command.test:
    description: Starts a test minigame.
    default: op
  nekarafishing.command.cancel:
    description: Cancels an active minigame.
    default: op
  nekarafishing.bypass:
    description: Bypasses the fishing minigame.
    default: false
