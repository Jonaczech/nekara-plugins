configuration-version: 1

storage:
  database-file: skills/data.db

# Every directly trained skill uses the same deterministic integer curve.
# The level cap is a system invariant fixed at 100.
progression:
  base-experience: 100
  linear-growth: 35
  quadratic-growth: 2

# Rebirth after level 100. Each rank returns this skill's spent perk points,
# resets only this skill, and permanently strengthens its perk statistics once.
new-game-plus:
  enabled: true
  experience-multiplier: 0.50
  perk-stat-bonus-per-rank: 0.25
  innate-gathering-double-drop-multiplier-per-rank: 1.25
  # Independent extra-roll chance for Farming harvests and player-killed animals.
  # It never contributes to the capped normal double-drop chance.
  farming-and-butchery-bonus-drop-chance: 0.30
  # Independent extra-roll chance for naturally broken logs and stems.
  woodcutting-bonus-drop-chance: 0.30
  # Independent extra-roll chance for eligible naturally dug blocks.
  digging-bonus-drop-chance: 0.30

# Small innate bonuses earned from level. Perks remain the dominant source of power.
level-rewards:
  gathering:
    double-drop-chance-per-level: 0.002
    maximum-double-drop-chance: 0.20
  digging:
    rare-drop-chance-per-level: 0.00010
    maximum-rare-drop-chance: 0.010
  fishing:
    # 0.5% from the first catch, rising to 2% at level 100.
    base-treasure-chance: 0.005
    treasure-chance-per-level: 0.00015
    maximum-treasure-chance: 0.020

# Shared event-driven XP controls. Per-skill XP values live in each skill folder.
activities:
  enabled: true
  deduplication-milliseconds: 750

# Global Luck applies only when Nekara rolls an entry from its own rare-loot table.
# It never changes crafting, normal drops, vanilla chest loot or vanilla fishing loot.
luck:
  maximum-points: 2
  rare-loot-chance-bonus-per-point: 0.02

# Weapon-family combat effects are always resolved server-side. Values are
# added to the selected weapon skill's perk statistics, never stored in items.
weapons:
  dagger:
    critical-chance: 0.06
    rear-attack-bonus: 0.25
  sword:
    bleed-chance: 0.04
  spear:
    armor-penetration: 0.12
  axe:
    critical-chance: 0.04
  greatsword:
    bleed-chance: 0.05
    cleave-damage-multiplier: 0.35
  hammer:
    armor-penetration: 0.20
    stun-chance: 0.10
