name: NekaraRPG
version: ${version}
main: cz.nekara.rpg.NekaraRPGPlugin
api-version: '26.1'
authors:
  - Nekara
description: Modular RPG, authentication, and immersion systems for Nekara.
softdepend:
  - ValhallaMMO
  - MythicMobs
  - AuthMe
commands:
  nekararpg:
    description: Manage NekaraRPG.
    usage: /nekararpg [menu|help|reload|status|update|sit|stand|lay|rise|mount|test [fishing|vein]|cancel [player]]
    aliases: [nrpg, nekarafishing, nfishing]
  nekaraauth:
    description: Opens and administers NekaraAuth.
    usage: /nekaraauth [menu|status|unregister <player>]
    aliases: [nauth]
  login:
    description: Optional fallback NekaraAuth login command; disabled by default.
    usage: /login <password>
    aliases: [l]
    permission: nekararpg.auth.fallback-commands
  register:
    description: Optional fallback NekaraAuth registration command; disabled by default.
    usage: /register <password> <password>
    aliases: [reg]
    permission: nekararpg.auth.fallback-commands
  logout:
    description: Logs the current player out of NekaraAuth.
    usage: /logout
permissions:
  nekararpg.menu.use:
    description: Opens the central NekaraRPG module menu.
    default: true
  nekararpg.use:
    description: Allows the fishing minigame to start.
    default: true
  nekararpg.command.help:
    description: Allows help for NekaraRPG.
    default: op
  nekararpg.command.reload:
    description: Reloads NekaraRPG configuration.
    default: op
  nekararpg.command.status:
    description: Shows NekaraRPG status.
    default: op
  nekararpg.command.update:
    description: Checks and reports NekaraRPG updates.
    default: op
  nekararpg.update.notify:
    description: Receives update notices after joining the server.
    default: op
  nekararpg.command.test:
    description: Starts a test minigame.
    default: op
  nekararpg.command.cancel:
    description: Cancels an active minigame.
    default: op
  nekararpg.bypass:
    description: Bypasses the fishing minigame.
    default: false
  nekararpg.sitting.use:
    description: Allows the player to sit and stand through NekaraRPG.
    default: true
  nekararpg.campfire.use:
    description: Allows sitting, lying, and campfire rest effects.
    default: true
  nekararpg.echo-vein.use:
    description: Allows ValhallaMMO Mining actions to trigger Echo Vein.
    default: true
  nekararpg.mount.use:
    description: Allows the player to create, manage, call, dismiss, and inspect their Nekara mount.
    default: true
  nekararpg.skills.use:
    description: Opens the native Nekara Skills progression overview when the module is enabled.
    default: true
  nekararpg.mount.admin:
    description: Allows administrators to open virtual horse creation for another player.
    default: op
  nekararpg.auth.admin:
    description: Allows authenticated players and console to administer NekaraAuth accounts.
    default: op
  nekararpg.auth.fallback-commands:
    description: Allows /login and /register only when commands.fallback-enabled is true in auth/config.yml.
    default: false
  nekarafishing.use:
    description: Legacy permission for the fishing minigame.
    default: true
  nekarafishing.command.help:
    description: Legacy permission for help.
    default: op
  nekarafishing.command.reload:
    description: Legacy permission for reload.
    default: op
  nekarafishing.command.status:
    description: Legacy permission for status.
    default: op
  nekarafishing.command.test:
    description: Legacy permission for test.
    default: op
  nekarafishing.command.cancel:
    description: Legacy permission for cancel.
    default: op
  nekarafishing.bypass:
    description: Legacy bypass permission for the fishing minigame.
    default: false
