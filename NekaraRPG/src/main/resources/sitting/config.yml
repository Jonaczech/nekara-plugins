# Sitting does not register /sit, avoiding command collisions with CMI.
require-ground: true
seat-y-offset: 0.20
allow-creative: true
allow-flying: false
stand-on-damage: true
# Campfire can recognize seats created by CMI and similar plugins. Horses and
# minecarts are not rest seats unless explicitly added here.
detect-external-seats: true
external-seat-entity-types:
  - ARMOR_STAND
