# Echo Vein is the first NekaraMining activity and has no cooldown.
echo-vein:
  trigger-chance: 0.05
  chain-chance: 0.50
  duration-ticks: 120
  search-radius: 4
  pulse-interval-ticks: 10
  experience-bonus-multiplier: 0.25
  bonus-drop-enabled: true
  ore-reveal:
    chance: 0.25
  particles:
    particle: END_ROD
    count: 8
    spread: 0.35

sounds:
  echo-vein-pulse:
    enabled: true
    sound: minecraft:block.amethyst_block.chime
    volume: 0.8
    pitch: 0.65
  echo-vein-ore-reveal:
    enabled: true
    sound: minecraft:block.amethyst_cluster.place
    volume: 0.9
    pitch: 1.15
  echo-vein-success:
    enabled: true
    sound: minecraft:block.amethyst_cluster.hit
    volume: 0.9
    pitch: 1.35
  echo-vein-failure:
    enabled: true
    sound: minecraft:block.deepslate.break
    volume: 0.7
    pitch: 0.65
