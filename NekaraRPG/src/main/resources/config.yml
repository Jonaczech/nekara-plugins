plugin:
  language: cs
  debug: false

updater:
  # Checks the latest stable release in Jonaczech/nekara-plugins. A verified
  # NekaraRPG.jar is staged in Paper's update folder and applied on restart.
  enabled: true
  automatic-checks: true
  auto-download: true
  notify-admins: true
  startup-delay-seconds: 30
  check-interval-hours: 6
  request-timeout-seconds: 20
  maximum-jar-size-megabytes: 16

modules:
  # Every gameplay area is shipped in the same NekaraRPG JAR and can be toggled
  # independently. Campfire accepts both NekaraRPG and supported external seats.
  fishing:
    enabled: true
  sitting:
    enabled: true
  campfire:
    enabled: true
  echo-vein:
    enabled: true

# Rare Mining activity unlocked through ValhallaMMO. A valid natural Mining XP
# action may reveal one nearby block; hit it with a pickaxe before the pulse ends.
echo-vein:
  minimum-mining-level: 50
  # 0.04 means a 4% chance after an eligible mining action.
  trigger-chance: 0.04
  cooldown-seconds: 480
  # 120 ticks is a six-second response window.
  duration-ticks: 120
  search-radius: 4
  pulse-interval-ticks: 10
  # Success grants 25% of the final triggering Mining XP. PLUGIN XP is used so
  # Rested and Valhalla global multipliers are not applied a second time.
  experience-bonus-multiplier: 0.25
  # One item is selected from the action's actual finalized natural and
  # Valhalla-prepared drops. Stack size and Fortune are never rerolled.
  bonus-drop-enabled: true
  particles:
    particle: END_ROD
    count: 8
    spread: 0.35

sitting:
  # Sitting works on any grounded position and does not register /sit, avoiding
  # command collisions with CMI. Use /nekararpg sit and /nekararpg stand.
  require-ground: true
  seat-y-offset: 0.20
  allow-creative: true
  allow-flying: false
  # Damage immediately removes the seat to prevent combat healing abuse.
  stand-on-damage: true
  # Campfire can also recognize seats created by CMI and similar plugins. Only
  # vehicle types listed here count, so horses and minecarts are not rest seats.
  detect-external-seats: true
  external-seat-entity-types:
    - ARMOR_STAND

campfire:
  # Only lit CAMPFIRE and SOUL_CAMPFIRE blocks count.
  radius: 5.0
  # Player and campfire state is evaluated once per second by default.
  update-period-ticks: 20
  healing:
    # One health point is half a heart.
    amount: 1.0
    period-seconds: 5
  hunger:
    # Hunger loss is completely blocked while actively resting. In addition,
    # one food point is restored every ten seconds by default.
    restore-amount: 1
    restore-period-seconds: 10
  rested:
    # Charge and duration use real wall-clock seconds, even when the server lags.
    charge-seconds: 20
    duration-seconds: 300
    # A smoker makes the hunger bar drain more slowly after leaving the camp.
    # 0.5 means half speed. Bare Rested does not reduce hunger loss.
    hunger-loss-multiplier: 0.5
    # Rested grants 10% more natural and shared XP for every ValhallaMMO skill.
    # Administrative, reset, redemption, and refund XP are not multiplied.
    valhalla-experience:
      enabled: true
      multiplier: 1.10
    # Haste I is granted only when the camp contains a crafting table. It also
    # provides Minecraft's standard status icon. Amplifier 0 means level I.
    haste:
      enabled: true
      amplifier: 0
      ambient: true
      particles: true
      icon: true
  camping:
    # Every unique enabled block type within this radius adds one minute to
    # Rested. Duplicate blocks of the same type do not stack.
    feature-radius: 5.0
    duration-per-feature-seconds: 60
    features:
      - CRAFTING_TABLE
      - BED
      - SMOKER
      - BARREL
      - WATER_CAULDRON
      - CARTOGRAPHY_TABLE
      - GRINDSTONE
    spawn-protection:
      # A bed near a lit campfire protects the wider camp from natural hostile
      # spawns. Existing mobs can still enter, and scripted spawns are untouched.
      enabled: true
      radius: 24.0
      natural-only: true
      # The production MythicMobs hostile random-spawn faction.
      mythic-hostile-faction: NekaraHostile
  group:
    # Healing and hunger restoration become stronger for players sharing one fire.
    multiplier-per-extra-player: 0.15
    maximum-multiplier: 1.75
  visuals:
    # A small shared particle signal confirms that active campfire rest is running.
    resting-particles:
      enabled: true
      particle: HAPPY_VILLAGER
      count: 4
      radius: 0.7
      y-offset: 0.35
    rested:
      # Rested always needs its own timer because Haste is conditional.
      # ACTION_BAR shows text above the hotbar; NONE disables the indicator.
      # Legacy BOSS_BAR values are accepted and migrated to ACTION_BAR behavior.
      indicator: ACTION_BAR
      particles:
        # Haste already has ambient particles; keep this extra effect opt-in.
        enabled: false
        particle: END_ROD
        count: 2
        radius: 0.55
        y-offset: 0.75

minigame:
  enabled: true
  display: ACTION_BAR
  # Logical positions. Each position is rendered as one thick line glyph.
  bar-length: 20
  # Higher values make the indicator move more slowly. 6 ticks is about half
  # the previous default speed.
  update-period-ticks: 6
  target-width: 5
  # Maximum indicator movement steps to reach a target after a successful hit.
  # This prevents an otherwise valid next target from appearing unreasonably far away.
  target-relocation-max-distance: 6
  hook-particles:
    enabled: true
    # Bukkit/Paper Particle enum name. SPLASH creates a subtle water ring.
    particle: SPLASH
    radius: 0.8
    count: 8
    interval-ticks: 4
    y-offset: 0.05
  # A random number of successful timing hits is selected for each minigame.
  required-hits-min: 3
  required-hits-max: 5
  max-misses: 1
  # 160 ticks = 8 seconds for the initial minigame window.
  timeout-ticks: 160
  # Time added after every successful hit. 30 ticks = 1.5 seconds.
  time-bonus-ticks: 30
  # Blocks movement through walls. 0 disables the visual hook pull.
  hook-pull-distance: 1.0
  move-target-after-hit: true
  randomize-start-position: true
  indicator-direction: RANDOM
  input-debounce-milliseconds: 150

fishing:
  # BITE_GATE cannot reliably preserve the internal bite state on this API.
  preferred-mode: DEFERRED_CATCH
  fallback-mode: DEFERRED_CATCH
  cancel-on-teleport: true
  cancel-on-world-change: true
  cancel-on-item-change: true
  cancel-on-damage: false
  require-fishing-rod-in-main-hand: true
  allow-creative: true
  allow-spectator: false

worlds:
  # ALL is the safe default for a fresh installation. Use WHITELIST when the
  # plugin should be limited to explicitly named worlds.
  mode: ALL
  list:
    - world

sounds:
  bite:
    enabled: true
    sound: minecraft:entity.fishing_bobber.splash
    volume: 1.0
    pitch: 1.0
  hit:
    enabled: true
    sound: minecraft:entity.experience_orb.pickup
    volume: 0.8
    pitch: 1.3
  miss:
    enabled: true
    sound: minecraft:entity.villager.no
    volume: 0.8
    pitch: 1.2
  timeout:
    enabled: true
    sound: nekara:fishing.timeout
    volume: 1.0
    pitch: 1.0
  escape:
    enabled: true
    sound: nekara:fishing.escape
    volume: 1.0
    pitch: 1.0
  minigame-success:
    enabled: true
    sound: minecraft:block.note_block.pling
    volume: 1.0
    pitch: 1.5
  catch-success:
    enabled: true
    sound: nekara:fishing.catch
    volume: 1.0
    pitch: 1.0
  campfire-rested:
    # A soft confirmation played once when the 20-second rest completes.
    enabled: true
    sound: minecraft:block.amethyst_block.chime
    volume: 0.65
    pitch: 1.15
  echo-vein-pulse:
    enabled: true
    sound: minecraft:block.amethyst_block.chime
    volume: 0.8
    pitch: 0.65
  echo-vein-success:
    enabled: true
    sound: minecraft:block.amethyst_cluster.hit
    volume: 0.9
    pitch: 1.35
  echo-vein-failure:
    enabled: true
    sound: minecraft:block.deepslate.break
    volume: 0.7
    pitch: 0.65

# Visual feedback is deliberately particle-only. It never creates or changes
# an ItemStack and is shown only to the fishing player.
effects:
  success:
    enabled: true
    # Bukkit/Paper Particle enum name.
    particle: HAPPY_VILLAGER
    count: 12
    duration-ticks: 8
    radius: 0.9
    y-offset: 0.05
  failure:
    enabled: true
    # Red particles make the escape immediately readable without chat spam.
    particle: DAMAGE_INDICATOR
    count: 12
    duration-ticks: 8
    radius: 0.9
    y-offset: 0.05

# Optional ValhallaMMO fishing integration. Rested XP settings are configured
# under campfire.rested.valhalla-experience.
valhalla:
  fishing-difficulty:
    enabled: true
    # Required successful pulls at the ValhallaMMO fishing skill max level.
    max-level-required-hits: 2
    # Allowed misses at the ValhallaMMO fishing skill max level.
    max-level-max-misses: 3
    tiers:
      novice:
        min-level: 1
        max-level: 30
        required-hits-min: 3
        required-hits-max: 5
        max-misses: 1
      skilled:
        min-level: 31
        max-level: 60
        required-hits-min: 3
        required-hits-max: 4
        max-misses: 2
      expert:
        min-level: 61
        # 0 means no upper bound.
        max-level: 0
        required-hits-min: 2
        required-hits-max: 3
        max-misses: 3
