# Core settings only. Each module keeps its detailed settings in
# plugins/NekaraRPG/<module>/config.yml.
configuration-layout: 2

plugin:
  language: cs
  debug: false

updater:
  # Checks the latest stable release in Jonaczech/nekara-plugins. A verified
  # NekaraRPG.jar is staged in Paper's update folder and applied on restart.
  enabled: true
  automatic-checks: true
  auto-download: true
  notify-admins: true
  startup-delay-seconds: 30
  check-interval-hours: 6
  request-timeout-seconds: 20
  maximum-jar-size-megabytes: 16

modules:
  # Modules share one JAR but can be enabled independently. Sitting and lying
  # are part of Campfire; detailed settings live in each module folder.
  auth:
    enabled: true
  fishing:
    enabled: true
  campfire:
    enabled: true
  mining:
    # Legacy Echo Vein observes ValhallaMMO Mining. Native Žilobití now lives
    # in the skills module, so this compatibility activity stays opt-in.
    enabled: false
  mounts:
    enabled: true
  # Nekara Skills is the native progression authority. XP, perks and active
  # abilities are guarded by real events, player-placed block tracking and
  # bounded async persistence.
  skills:
    enabled: true
